name: Morning30
options:
  bundleIdPrefix: com.morning30
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Morning30:
    type: application
    platform: iOS
    sources: [Morning30]
    entitlements:
      path: Morning30/Morning30.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morning30.app
        PRODUCT_NAME: morning30
        INFOPLIST_FILE: Morning30/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # Set your Apple team in Xcode (Signing & Capabilities) before archiving.
        CODE_SIGN_STYLE: Automatic
