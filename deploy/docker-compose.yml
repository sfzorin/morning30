services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: morning30-web:latest
    container_name: morning30-web
    restart: unless-stopped
    environment:
      MORNING_DB: /data/morning.db
      # From the deploy workflow (GitHub secrets / variables); empty = defaults.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK: ${AI_FALLBACK:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    expose:
      - "8080"
    volumes:
      - dani_data:/data
    networks:
      - global-proxy-net

networks:
  global-proxy-net:
    external: true

volumes:
  dani_data:
